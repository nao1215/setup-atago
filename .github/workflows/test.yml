name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Static checks — these always run.
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run ShellCheck
        # -x lets ShellCheck follow the sourced install.sh from version_test.sh.
        run: shellcheck -x scripts/install.sh scripts/version_test.sh scripts/release_meta.sh scripts/release_meta_test.sh

      - name: Run actionlint
        uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7 # v2.2.0

      - name: Test version normalization
        run: bash scripts/version_test.sh

      - name: Test release tag normalization
        run: bash scripts/release_meta_test.sh

  # Integration test that actually installs atago on every supported platform.
  install:
    name: Install (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, macos-15-intel, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup atago
        id: setup
        uses: ./
        with:
          version: latest

      - name: Print resolved outputs
        shell: bash
        run: |
          echo "version=${{ steps.setup.outputs.version }}"
          echo "bin-path=${{ steps.setup.outputs.bin-path }}"
          echo "install-dir=${{ steps.setup.outputs.install-dir }}"

      - name: Verify atago on PATH (bash)
        shell: bash
        run: |
          command -v atago
          atago version || atago --version || atago --help

      - name: Verify atago on PATH (PowerShell)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Get-Command atago
          atago --version

  # A pinned version must install exactly that release, whether the input has
  # the leading "v" or not, and a custom install-dir must be honoured.
  install-pinned:
    name: Install pinned ${{ matrix.version }} (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        version: [v0.26.3, 0.26.3]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup atago
        id: setup
        uses: ./
        with:
          version: ${{ matrix.version }}
          install-dir: ${{ runner.temp }}/atago-pinned

      - name: Verify the pinned release was installed
        shell: bash
        env:
          OUT_VERSION: ${{ steps.setup.outputs.version }}
          OUT_BIN_PATH: ${{ steps.setup.outputs.bin-path }}
          OUT_INSTALL_DIR: ${{ steps.setup.outputs.install-dir }}
          WANT_DIR: ${{ runner.temp }}/atago-pinned
        run: |
          test "${OUT_VERSION}" = "v0.26.3" || { echo "version output: ${OUT_VERSION}" >&2; exit 1; }
          test "${OUT_INSTALL_DIR}" = "${WANT_DIR}" || { echo "install-dir output: ${OUT_INSTALL_DIR}" >&2; exit 1; }
          test -x "${OUT_BIN_PATH}" || { echo "bin-path is not executable: ${OUT_BIN_PATH}" >&2; exit 1; }
          got="$(atago version)"
          echo "${got}"
          test "${got}" = "atago v0.26.3"

  # A release that does not exist must fail the step instead of installing
  # something else or succeeding with nothing on PATH.
  install-missing:
    name: Install missing version (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup atago with a version that was never released
        id: setup
        continue-on-error: true
        uses: ./
        with:
          version: v0.0.0

      - name: Expect the setup step to have failed
        shell: bash
        env:
          OUTCOME: ${{ steps.setup.outcome }}
        run: |
          test "${OUTCOME}" = "failure" || { echo "setup outcome: ${OUTCOME}" >&2; exit 1; }
          if command -v atago >/dev/null 2>&1; then
            echo "atago is on PATH after a failed install: $(command -v atago)" >&2
            exit 1
          fi
